[workspace]

[package]
name = "pixa-launcher"
version = "0.1.0"
edition = "2021"
publish = false
description = "Validates signed Pixa release manifests before any editor is installed."

[dependencies]
ed25519-dalek = "2.1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
