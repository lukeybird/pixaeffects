[workspace]

[package]
name = "pixa-launcher"
version = "0.2.0"
edition = "2021"
publish = false
description = "The native Pixa app library and verified Mac installer."

[dependencies]
ed25519-dalek = "2.1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots", "json"] }
tempfile = "3"
fs2 = "0.4"
plist = "1"
