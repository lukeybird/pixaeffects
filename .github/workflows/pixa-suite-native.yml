name: Pixa suite native checks
on:
  push:
    branches: [pixa-suite-product]
    paths:
      - 'pixa-suite/**'
      - '.github/workflows/pixa-suite-native.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pixa-suite-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: ${{ matrix.product }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        product: [pixavector, pixafilm, pixalight, pixapdf, pixadesign, pixainterface, pixatexture, pixamaterial, pixaword, pixasound, pixadeck, pixacad, pixagrid, pixaanything]
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@main
    with:
      os: '["ubuntu-24.04", "windows-latest", "macos-15-intel"]'
      packages: 'pkg-config libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev libvulkan-dev libdbus-1-dev libgtk-3-dev'
      toolchain: '1.95.0'
      targets: ''
      tools: ''
      craft-fonts-ref: ''
      require-craft-fonts: false
      cache-save-on-dispatch: false
      timeout-minutes: 120
      command: python pixa-suite/ci.py '${{ matrix.product }}'
